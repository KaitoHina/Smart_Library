<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Library · 管理員</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ede9e0; color: #1e3348; font: 16px/1.6 "Segoe UI",sans-serif; }
  main { max-width: 1000px; margin: auto; padding: 32px 20px; }
  h1 { margin: 0; } h2 { margin: 0 0 12px; }
  .muted { color: #596779; }
  section { background: #fffdf8; border: 1px solid #d4cec2; border-radius: 18px; padding: 24px; margin: 20px 0; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap: 20px; margin: 20px 0; }
  strong { font-size: 28px; display: block; }
  button { font: inherit; border: 1px solid #36506b; border-radius: 8px; background: #1e3348; color: white; padding: 10px 18px; margin: 4px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #event[data-level="1"] { border-left: 8px solid #c79827; }
  #event[data-level="2"] { border-left: 8px solid #cb7529; }
  #event[data-level="3"], #event[data-level="4"] { border-left: 8px solid #ae3535; }
  progress { width: 100%; accent-color: #b97e24; height: 18px; }
  li { margin-bottom: 12px; }
</style>
<main>
  <p class="muted">SMART LIBRARY · LOCAL ADMINISTRATION</p>
  <h1>桌區噪音監察</h1>
  <p>本機管理頁 · <a href="http://localhost:8080">開啟 Dashboard</a></p>
  <p id="connection" role="status">正在連接監察服務…</p>
  <section id="event" data-level="0">
    <h2>Table 05</h2>
    <p id="status" role="status"></p>
    <div class="metrics">
      <div>事件持續<strong id="duration">—</strong></div>
      <div>最近 30 秒偏吵比例<strong id="fraction">—</strong></div>
      <div>提醒級別<strong id="level">—</strong></div>
    </div>
    <progress id="ratio" max="100" value="0" aria-label="偏吵比例"></progress>
    <p id="timing" class="muted"></p>
    <button id="acknowledge" disabled>已知悉</button>
    <button id="handled" disabled>已處理</button>
    <p id="actions"></p>
  </section>
  <section>
    <h2>判定規則</h2>
    <p id="rules"></p>
    <p>已處理會記錄操作時間。現場仍然偏吵時，監察和計時會繼續。斷線會結束當前事件並標示監測中斷。</p>
  </section>
  <section><h2>最近事件</h2><ul id="history"></ul></section>
  <p class="muted">事件暫存於 server 記憶體。重新整理此頁可保留事件，重啟 server 會清除。其他桌區尚未接駁感測器。</p>
</main>
<script>
const get = id => document.getElementById(id);
const time = value => value ? new Date(value).toLocaleString() : '—';
const duration = ms => Math.floor(ms / 60000) + '分 ' + Math.floor(ms / 1000 % 60) + '秒';
let pending = false;
async function refresh() {
  try {
    const response = await fetch('/status', { cache: 'no-store' });
    if (!response.ok) throw Error('服務回應 ' + response.status);
    const data = await response.json();
    get('connection').textContent = '最後收到感測資料 ' + time(data.lastReceivedAt);
    get('status').textContent = data.status === 'Monitoring interrupted' ? '監測中斷，等待有效噪音資料' :
      data.active ? '持續偏吵，請按現場情況決定是否處理' : '觀察中，未有持續噪音事件';
    get('duration').textContent = duration(data.durationMs);
    get('fraction').textContent = Math.round(data.noisyFraction * 100) + '%';
    get('ratio').value = data.noisyFraction * 100;
    get('level').textContent = ['觀察','關注','建議留意','建議查看現場','長時間偏吵'][data.level];
    get('event').dataset.level = data.level;
    get('timing').textContent = '有效觀察窗口 ' + duration(data.windowCoverageMs) +
      ' · 事件開始 ' + time(data.active?.startedAt);
    get('actions').textContent = '知悉時間 ' + time(data.active?.acknowledgedAt) +
      ' · 處理時間 ' + time(data.active?.handledAt);
    for (const name of ['acknowledge','handled']) get(name).disabled = !data.active || pending;
    const config = data.config;
    get('rules').textContent = '完整觀察 ' + config.windowMs / 1000 + ' 秒，偏吵比例達 ' +
      config.noisyFraction * 100 + '% 時建立事件，連續安靜 ' + config.quietToEndMs / 1000 +
      ' 秒後結束。提醒門檻為 ' + config.levelsMs.map(ms => ms / 1000 + '秒').join('、') +
      '。優先使用 firmware 的 NOISY 分類，缺少分類時使用振幅 ≥ ' + config.fallbackNoisyAmplitude + '。';
    get('history').replaceChildren(...data.history.map(event => {
      const item = document.createElement('li');
      item.textContent = time(event.startedAt) + ' — ' + time(event.endedAt) + ' · ' +
        duration(event.endedAt - event.startedAt) + ' · ' + event.reason +
        ' · 已知悉 ' + time(event.acknowledgedAt) + ' · 已處理 ' + time(event.handledAt);
      return item;
    }));
  } catch (error) {
    get('connection').textContent = '無法更新管理頁 · ' + error.message;
    for (const name of ['acknowledge','handled']) get(name).disabled = true;
  }
}
for (const action of ['acknowledge','handled']) get(action).addEventListener('click', async () => {
  pending = true;
  for (const name of ['acknowledge','handled']) get(name).disabled = true;
  try {
    const response = await fetch('/' + action, { method: 'POST' });
    if (!response.ok) throw Error('操作失敗 ' + response.status);
  } catch (error) { get('connection').textContent = error.message; }
  finally { pending = false; await refresh(); }
});
async function poll() { await refresh(); setTimeout(poll, 1000); }
poll();
</script>
</html>
